<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMINI KTV</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --primary: #00ff00; --info: #00ccff; --bili: #fb7299; --danger: #ff4444; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 10px; height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .app-container { display: flex; gap: 20px; max-width: 1400px; width: 100%; height: 95vh; }
        
        .main-area { flex: 1.5; background: var(--panel); padding: 20px; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header-controls { display: flex; align-items: center; justify-content: space-between; background: #252525; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; gap: 15px; }
        
        #player-container { width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid var(--primary); border-radius: 10px; overflow: hidden; position: relative; }
        .video-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        .active-player { display: block; }

        .side-area { flex: 1; background: #111; padding: 20px; border-radius: 20px; border: 1px solid #333; display: flex; flex-direction: column; min-width: 350px; }
        .side-controls { background: #222; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #444; }
        .side-controls input { width: 100%; padding: 12px; background: #333; border: 1px solid #555; color: #fff; border-radius: 6px; margin-bottom: 10px; box-sizing: border-box; outline: none; }
        
        .btn-group { display: flex; gap: 8px; width: 100%; }
        .btn-group button { flex: 1; padding: 12px 5px; font-size: 0.9em; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-add { background: var(--primary); color: #000; }
        .btn-insert { background: #ffcc00; color: #000; }
        .btn-skip { background: var(--danger); color: #fff; }
        .btn-join { background: var(--info); color: #000; padding: 8px 15px; }

        #list-content { flex-grow: 1; overflow-y: auto; margin-top: 5px; }
        .song-item { padding: 12px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }
        #my-id { color: var(--primary); font-weight: bold; cursor: pointer; text-decoration: underline; font-family: monospace; font-size: 1.2em; }
        #toast { position: fixed; top: 20px; right: 20px; background: var(--info); color: #000; padding: 12px 24px; border-radius: 8px; font-weight: bold; display: none; z-index: 1000; }
        #volume-hint { color: #ffcc00; font-size: 0.85em; margin-top: 10px; text-align: center; }

        @media (max-width: 768px) {
            body { overflow: auto; height: auto; }
            .app-container { flex-direction: column; height: auto; }
            #player-container, #volume-hint { display: none !important; }
            .main-area { flex: none; order: 1; }
            .side-area { order: 2; min-width: auto; height: 75vh; }
        }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="app-container">
    <div class="main-area">
        <div class="header-controls">
            <div><span style="color:#888; font-size:0.8em;">我的房號:</span> <span id="my-id" onclick="copyId()">連線中...</span></div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="peer-id" style="padding:8px; background:#333; border:1px solid #555; color:#fff; border-radius:6px; width:120px;" placeholder="輸入房號">
                <button class="btn-join" onclick="connectToHost()">連線</button>
            </div>
        </div>
        <div id="player-container">
            <div id="yt-player" class="video-frame"></div>
            <iframe id="bili-player" class="video-frame" allow="autoplay; fullscreen" allowfullscreen="true" referrerpolicy="no-referrer"></iframe>
        </div>
        <div id="volume-hint">📢 提示：若畫面未自動播放，請點擊播放器或畫面任意處。</div>
    </div>

    <div class="side-area">
        <h3 style="margin:0 0 15px 0; color: var(--primary);">點歌管理</h3>
        <div class="side-controls">
            <input type="text" id="videoUrl" placeholder="貼上網址 (YT / Bili)...">
            <div class="btn-group">
                <button class="btn-add" onclick="handleSongAction('add')">點歌</button>
                <button class="btn-insert" onclick="handleSongAction('insert')">🚀 插播</button>
                <button class="btn-skip" onclick="skipSong()">⏭️ 切歌</button>
            </div>
        </div>
        <div id="list-content"></div>
    </div>
</div>

<script>
    const shortId = Math.random().toString(36).substring(2, 8).toUpperCase();
    const peer = new Peer(shortId, {
        config: { 'iceServers': [{ url: 'stun:stun.l.google.com:19302' }, { url: 'stun:stun1.l.google.com:19302' }] }
    });

    let conn, ytPlayer;
    let songList = [{ id: 'QDia3e12czc', type: 'youtube' }]; 

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.innerText = msg; t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    peer.on('open', (id) => document.getElementById('my-id').innerText = id);
    peer.on('connection', (c) => { conn = c; setupConn(); });

    function connectToHost() {
        const id = document.getElementById('peer-id').value.trim().toUpperCase();
        if(!id) return;
        conn = peer.connect(id);
        setupConn();
    }

    function setupConn() {
        conn.on('open', () => {
            showToast("✅ 連線成功！");
            broadcastList();
        });
        conn.on('data', (data) => {
            if (data.type === 'updateList') {
                const isNewFirst = songList.length === 0 || songList[0].id !== data.list[0]?.id;
                songList = data.list;
                updateUI();
                if (isNewFirst && songList.length > 0 && window.innerWidth > 768) playCurrent();
            }
        });
    }

    function handleSongAction(action) {
        const url = document.getElementById('videoUrl').value.trim();
        const ytRegex = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
        const biliRegex = /(BV[a-zA-Z0-9]{10})/;
        
        let songData = null;
        if (url.match(ytRegex)) songData = { id: url.match(ytRegex)[1], type: 'youtube' };
        else if (url.match(biliRegex)) songData = { id: url.match(biliRegex)[1], type: 'bilibili' };
        else if (url.startsWith('BV')) songData = { id: url, type: 'bilibili' };
        else if (url.length === 11) songData = { id: url, type: 'youtube' };

        if (!songData) return alert("網址格式錯誤");
        if (action === 'add') songList.push(songData);
        else songList.splice(1, 0, songData);
        
        broadcastList(); updateUI();
        if (songList.length === 1 && window.innerWidth > 768) playCurrent();
        document.getElementById('videoUrl').value = '';
    }

    function playCurrent() {
        if (songList.length === 0 || window.innerWidth <= 768) return;
        const current = songList[0];
        stopAllPlayers();

        if (current.type === 'youtube') {
            document.getElementById('yt-player').classList.add('active-player');
            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(current.id);
                // 嘗試強制播放 (若失敗則是瀏覽器攔截)
                setTimeout(() => { if (ytPlayer.getPlayerState() !== 1) ytPlayer.playVideo(); }, 1000);
            }
        } else {
            const bili = document.getElementById('bili-player');
            bili.src = `https://player.bilibili.com/player.html?bvid=${current.id}&page=1&high_quality=1&autoplay=1&muted=0`;
            bili.classList.add('active-player');
        }
    }

    function stopAllPlayers() {
        document.getElementById('yt-player').classList.remove('active-player');
        document.getElementById('bili-player').classList.remove('active-player');
        document.getElementById('bili-player').src = "";
        if (ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo();
    }

    function broadcastList() { if (conn && conn.open) conn.send({ type: 'updateList', list: songList }); }
    function skipSong() { songList.shift(); broadcastList(); updateUI(); if (songList.length > 0) playCurrent(); else stopAllPlayers(); }
    function updateUI() {
        const box = document.getElementById('list-content');
        box.innerHTML = songList.map((s, i) => `
            <div class="song-item">
                <span style="color:${i===0?'#ff00ff':'#fff'}">${i===0?'▶️':''} [${s.type==='youtube'?'YT':'BILI'}] ${s.id}</span>
                <button style="background:transparent; color:#666; border:none;" onclick="removeSong(${i})">❌</button>
            </div>`).join('');
    }
    function removeSong(i) { if (i === 0) skipSong(); else { songList.splice(i, 1); broadcastList(); updateUI(); } }
    function copyId() { navigator.clipboard.writeText(document.getElementById('my-id').innerText).then(() => showToast("📋 房號已複製")); }

    // YouTube API 穩定初始化
    function onYouTubeIframeAPIReady() {
        if (window.innerWidth <= 768) return;
        ytPlayer = new YT.Player('yt-player', {
            videoId: songList[0]?.type === 'youtube' ? songList[0].id : '',
            playerVars: { 'autoplay': 1, 'rel': 0, 'playsinline': 1 },
            events: { 
                'onReady': (e) => { if(songList[0]?.type==='youtube') e.target.playVideo(); },
                'onStateChange': (e) => { if (e.data === 0) skipSong(); } 
            }
        });
    }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
