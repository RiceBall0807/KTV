<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GEMINI KTV - Cinema Edition</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        :root { --bg: #0d0d0d; --panel: #1a1a1a; --primary: #00ff00; --info: #00ccff; --danger: #ff4444; }
        body { background: var(--bg); color: #fff; font-family: sans-serif; margin: 0; padding: 10px; height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .app-container { display: flex; gap: 15px; width: 100%; max-width: 1600px; height: 95vh; }
        
        /* 【劇院排版】左側影片區極大化 */
        .main-area { flex: 3; background: var(--panel); padding: 20px; border-radius: 20px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.8); min-width: 0; }
        
        /* Google TV 巨型房號 */
        .header-controls { display: flex; align-items: center; justify-content: space-between; background: #252525; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
        #my-id { 
            color: var(--primary); font-weight: bold; font-family: monospace; 
            font-size: 80px !important; line-height: 1; letter-spacing: 5px; 
            text-shadow: 0 0 15px rgba(0,255,0,0.6); cursor: pointer;
        }

        /* 播放器容器 */
        #player-container { width: 100%; aspect-ratio: 16/9; background: #000; border: 2px solid var(--primary); border-radius: 10px; overflow: hidden; position: relative; }
        .video-frame { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; display: none; }
        .active-player { display: block; }

        /* 【歌單區】縮小至右側 */
        .side-area { flex: 0.8; background: #111; padding: 20px; border-radius: 20px; border: 1px solid #333; display: flex; flex-direction: column; min-width: 300px; max-width: 380px; }
        .side-controls input { width: 100%; padding: 12px; background: #333; border: 1px solid #555; color: #fff; border-radius: 8px; margin-bottom: 10px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 8px; }
        .btn-group button { flex: 1; padding: 12px 5px; font-weight: bold; border-radius: 8px; border: none; cursor: pointer; }
        
        #list-content { flex-grow: 1; overflow-y: auto; margin-top: 10px; }
        .song-item { padding: 12px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .song-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-right: 10px; font-size: 0.95em; }

        #toast { position: fixed; top: 20px; right: 20px; background: var(--info); color: #000; padding: 12px 24px; border-radius: 8px; display: none; z-index: 1000; }

        /* 手機版自動堆疊 */
        @media (max-width: 1024px) {
            body { overflow: auto; height: auto; }
            .app-container { flex-direction: column; height: auto; }
            .main-area { flex: none; width: 100%; padding: 10px; }
            #player-container { display: none !important; }
            #my-id { font-size: 45px !important; }
            .side-area { flex: none; width: 100%; max-width: none; min-height: 550px; }
            .header-controls { flex-direction: column; text-align: center; }
        }
    </style>
</head>
<body>

<div id="toast"></div>

<div class="app-container">
    <div class="main-area">
        <div class="header-controls">
            <div><span style="color:#888; font-size: 0.8em;">ROOM:</span> <span id="my-id" onclick="copyId()">...</span></div>
            <div style="display:flex; gap:8px;">
                <input type="text" id="peer-id" style="width:80px; padding:10px; background:#444; color:#fff; border:none; border-radius:6px;" placeholder="房號">
                <button onclick="connectToHost()" style="background:var(--info); border:none; padding:10px; font-weight:bold; border-radius:6px; cursor:pointer;">連線</button>
            </div>
        </div>
        
        <div id="player-container">
            <div id="yt-player" class="video-frame"></div>
            <iframe id="bili-player" class="video-frame" allow="autoplay; fullscreen" referrerpolicy="no-referrer"></iframe>
        </div>
    </div>

    <div class="side-area">
        <h3 style="margin:0 0 15px 0; color: var(--primary);">📜 待播清單 <span id="role-tag" style="font-size:0.5em; color:#666;"></span></h3>
        <div class="side-controls">
            <input type="text" id="videoUrl" placeholder="貼上 YouTube 或 Bili 網址...">
            <div class="btn-group">
                <button style="background:var(--primary); color:#000;" onclick="handleAction('add')">點歌</button>
                <button style="background:#ffcc00; color:#000;" onclick="handleAction('insert')">插播</button>
                <button style="background:var(--danger); color:#fff;" onclick="skipSong()">切歌</button>
            </div>
        </div>
        <div id="list-content"></div>
    </div>
</div>

<script>
    const shortId = Math.random().toString(36).substring(2, 8).toUpperCase();
    const peer = new Peer(shortId);
    let connections = [];
    let songList = []; 
    let isHost = true;
    let ytPlayer;

    peer.on('open', (id) => {
        document.getElementById('my-id').innerText = id;
        document.getElementById('role-tag').innerText = "(房主模式)";
    });

    peer.on('connection', (conn) => {
        isHost = true;
        setupConn(conn);
        showToast("📢 賓客已連線");
    });

    function connectToHost() {
        const id = document.getElementById('peer-id').value.trim().toUpperCase();
        if(!id) return;
        isHost = false;
        document.getElementById('role-tag').innerText = "(賓客模式)";
        const conn = peer.connect(id);
        setupConn(conn);
    }

    function setupConn(conn) {
        connections.push(conn);
        conn.on('open', () => { if (isHost) conn.send({ type: 'sync', list: songList }); });
        conn.on('data', (data) => {
            if (data.type === 'cmd') {
                if (data.action === 'add') addSong(data.song, false);
                else if (data.action === 'insert') addSong(data.song, true);
                else if (data.action === 'skip') skipSong();
                else if (data.action === 'remove') removeSong(data.index);
            } else if (data.type === 'sync') {
                songList = data.list;
                updateUI();
            }
        });
    }

    async function addSong(songData, isInsert) {
        if (isInsert) songList.splice(1, 0, songData); else songList.push(songData);
        updateUI();
        if (isHost && songList.length === 1) playCurrent();
        broadcast();

        if (songData.type === 'youtube') {
            try {
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${songData.id}`);
                const json = await res.json();
                songData.title = json.title || songData.id;
                updateUI(); broadcast();
            } catch (e) {}
        }
    }

    function handleAction(action) {
        const url = document.getElementById('videoUrl').value.trim();
        const songData = parseUrl(url);
        if (!songData) return alert("網址格式錯誤");

        if (isHost) {
            addSong(songData, action === 'insert');
        } else if (connections[0]?.open) {
            connections[0].send({ type: 'cmd', action: action, song: songData });
        }
        document.getElementById('videoUrl').value = '';
    }

    function playCurrent() {
        if (songList.length === 0 || window.innerWidth <= 1024) return;
        const cur = songList[0];
        stopAll();

        if (cur.type === 'youtube') {
            document.getElementById('yt-player').classList.add('active-player');
            if (ytPlayer && ytPlayer.loadVideoById) {
                ytPlayer.loadVideoById(cur.id);
            } else {
                setTimeout(playCurrent, 1000); 
            }
        } else {
            const b = document.getElementById('bili-player');
            b.src = `https://player.bilibili.com/player.html?bvid=${cur.id}&autoplay=1&muted=0`;
            b.classList.add('active-player');
        }
    }

    function stopAll() {
        document.querySelectorAll('.video-frame').forEach(f => { f.classList.remove('active-player'); f.src=""; });
        if (ytPlayer && ytPlayer.stopVideo) try { ytPlayer.stopVideo(); } catch(e) {}
    }

    function skipSong() {
        if (songList.length === 0) return;
        if (isHost) {
            songList.shift();
            updateUI();
            if (songList.length > 0) playCurrent(); else stopAll();
            broadcast();
        } else if (connections[0]?.open) {
            connections[0].send({ type: 'cmd', action: 'skip' });
        }
    }

    function removeSong(i) {
        if (isHost) {
            if (i === 0) skipSong();
            else { songList.splice(i, 1); updateUI(); broadcast(); }
        } else if (connections[0]?.open) {
            connections[0].send({ type: 'cmd', action: 'remove', index: i });
        }
    }

    function broadcast() {
        if (isHost) connections.forEach(c => { if (c.open) c.send({ type: 'sync', list: songList }); });
    }

    function parseUrl(url) {
        const yt = url.match(/(?:youtube\.com\/.*[?&]v=|youtu\.be\/)([^"&?\/\s]{11})/);
        const bili = url.match(/(BV[a-zA-Z0-9]{10})/);
        if (yt) return { id: yt[1], type: 'youtube', title: yt[1] };
        if (bili) return { id: bili[1], type: 'bilibili', title: 'Bili: ' + bili[1] };
        return null;
    }

    function updateUI() {
        const box = document.getElementById('list-content');
        box.innerHTML = songList.map((s, i) => `
            <div class="song-item">
                <div class="song-title" style="color:${i===0?'#ff00ff':'#fff'}">${i===0?'▶️':i+1+'.'} ${s.title}</div>
                <button onclick="removeSong(${i})" style="background:none; border:none; color:#666; cursor:pointer; font-size:18px;">×</button>
            </div>
        `).join('');
    }

    function copyId() { navigator.clipboard.writeText(document.getElementById('my-id').innerText).then(() => showToast("📋 房號已複製")); }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 3000); }

    function onYouTubeIframeAPIReady() {
        ytPlayer = new YT.Player('yt-player', { events: { 'onStateChange': (e) => { if (e.data === 0) skipSong(); } } });
    }
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
